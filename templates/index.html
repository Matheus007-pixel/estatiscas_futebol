<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estatísticas de Futebol</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS próprio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body id="body">

<div class="container py-4">

    <!-- Título -->
    <h1 class="text-center mb-4">
    <i class="fa-solid fa-futbol"></i> Estatísticas de Futebol
</h1>


    <!-- Botão cadastrar -->
    <div class="text-end mb-4">
        <a href="{{ url_for('cadastrar') }}" class="btn btn-success">
            <i class="fa-solid fa-plus"></i> Cadastrar novo time

        </a>
    </div>
    <div class="text-end mb-4">
    <button onclick="toggleDarkMode()" class="btn btn-dark" id="theme-btn">
    <i class="fa-solid fa-moon"></i> Dark Mode
    </button>

</div>


    <!-- Cards -->
    <div class="row">
        {% for time in times %}
        <div class="col-md-4 mb-4">
            <div class="card p-3 text-center">

                <!-- Escudo -->
               <div class="d-flex justify-content-center align-items-center mb-3"
     style="height: 140px;">
    <img src="{{ time['escudo'] }}"
         alt="Escudo {{ time['nome'] }}"
         style="max-height: 120px; max-width: 120px; object-fit: contain;">
</div>



                <!-- Nome -->
               <a href="{{ url_for('time', id=time['id']) }}" class="nome-time">
    <i class="fa-solid fa-shield-halved"></i> {{ time['nome'] }}
</a>


                <!-- Estatísticas -->
                <div class="stats">
                   <span class="badge bg-secondary">
    <i class="fa-solid fa-calendar-days"></i> Jogos: {{ time['jogos'] }}
</span>

<span class="badge bg-success">
    <i class="fa-solid fa-futbol"></i> Gols: {{ time['gols'] }}
</span>

                </div>

                <!-- Botões -->
                <div class="mt-3">
                    <a href="{{ url_for('editar', id=time['id']) }}"
                       class="btn btn-warning btn-sm">
                        <i class="fa-solid fa-pen-to-square"></i> Editar
                    </a>

                    <a href="{{ url_for('excluir', id=time['id']) }}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Deseja excluir este time?')">
                        <i class="fa-solid fa-trash"></i> Excluir
                    </a>
                </div>

            </div>
        </div>
        {% endfor %}
    </div>

</div>
<script>
    const body = document.getElementById("body");
    const btn = document.getElementById("theme-btn");
    const icon = btn.querySelector("i");

    // 🔁 Aplica tema salvo ao carregar
    if (localStorage.getItem("theme") === "dark") {
        body.classList.add("dark");
        icon.classList.replace("fa-moon", "fa-sun");
        btn.classList.replace("btn-dark", "btn-light");
    }

    function toggleDarkMode() {
        body.classList.toggle("dark");

        if (body.classList.contains("dark")) {
            localStorage.setItem("theme", "dark");
            icon.classList.replace("fa-moon", "fa-sun");
            btn.classList.replace("btn-dark", "btn-light");
        } else {
            localStorage.setItem("theme", "light");
            icon.classList.replace("fa-sun", "fa-moon");
            btn.classList.replace("btn-light", "btn-dark");
        }
    }
</script>

</body>
</html>
