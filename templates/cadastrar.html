<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Time</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS próprio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body id="body">

<div class="container py-5">

    <div class="card p-4 mx-auto" style="max-width: 600px;">

        <!-- Título -->
        <h2 class="mb-4 text-center">
            <i class="fa-solid fa-plus-circle"></i> Cadastrar Time
        </h2>

        <!-- Formulário -->
        <form method="POST">

            <!-- Nome -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fa-solid fa-shield-halved"></i> Nome do Time
                </label>
                <input type="text"
                       name="nome"
                       class="form-control"
                       placeholder="Ex: Flamengo"
                       required>
            </div>

            <!-- Jogos -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fa-solid fa-calendar-days"></i> Jogos
                </label>
                <input type="number"
                       name="jogos"
                       class="form-control"
                       placeholder="Ex: 38"
                       required>
            </div>

            <!-- Gols -->
            <div class="mb-4">
                <label class="form-label">
                    <i class="fa-solid fa-futbol"></i> Gols
                </label>
                <input type="number"
                       name="gols"
                       class="form-control"
                       placeholder="Ex: 45"
                       required>
            </div>

            <!-- Botões -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success">
                    <i class="fa-solid fa-floppy-disk"></i> Cadastrar
                </button>

                <a href="{{ url_for('home') }}" class="btn btn-outline-secondary">
                    <i class="fa-solid fa-arrow-left"></i> Voltar
                </a>
            </div>

        </form>

    </div>

</div>

<!-- Dark Mode Script -->
<script>
function toggleDarkMode() {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
        localStorage.setItem("theme", "dark");
    } else {
        localStorage.setItem("theme", "light");
    }
}

if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}
</script>

</body>
</html>
