<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ time['nome'] }}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS próprio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body id="body">

<div class="container py-5">

    <div class="card p-4 text-center mx-auto" style="max-width: 500px;">

        <!-- Escudo -->
       <div class="d-flex justify-content-center align-items-center mb-3"
     style="height: 140px;">
    <img src="{{ time['escudo'] }}"
         alt="Escudo {{ time['nome'] }}"
         style="max-height: 120px; max-width: 120px; object-fit: contain;">
</div>



        <!-- Nome -->
        <h2 class="mt-3">
            <i class="fa-solid fa-shield-halved"></i> {{ time['nome'] }}
        </h2>

        <hr>

        <!-- Estatísticas -->
        <div class="stats justify-content-center mt-3">
            <span class="badge bg-secondary">
                <i class="fa-solid fa-calendar-days"></i>
                Jogos: {{ time['jogos'] }}
            </span>

            <span class="badge bg-success">
                <i class="fa-solid fa-futbol"></i>
                Gols: {{ time['gols'] }}
            </span>
        </div>

        <!-- Ações -->
        <div class="mt-4">
            <a href="{{ url_for('editar', id=time['id']) }}"
               class="btn btn-warning btn-sm">
                <i class="fa-solid fa-pen-to-square"></i> Editar
            </a>

            <a href="{{ url_for('excluir', id=time['id']) }}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Deseja excluir este time?')">
                <i class="fa-solid fa-trash"></i> Excluir
            </a>
        </div>
    </div>

    <!-- Voltar -->
    <div class="text-center mt-4">
        <a href="{{ url_for('home') }}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i> Voltar
        </a>
    </div>

</div>

<!-- Dark Mode Script -->
<script>
function toggleDarkMode() {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
        localStorage.setItem("theme", "dark");
    } else {
        localStorage.setItem("theme", "light");
    }
}

if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}
</script>

</body>
</html>
